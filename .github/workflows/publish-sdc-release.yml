name: Publish SDC 0.3.0 assets

on:
  push:
    branches:
      - upload/sdc-v0.3.0

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble release files
        shell: bash
        run: |
          set -euo pipefail
          cat upload-parts/SDC-v0.3.0.apk.part-* > /tmp/SDC-v0.3.0.apk
          cat upload-parts/SDC-v0.3.0-source.zip.part-* > /tmp/SDC-v0.3.0-source.zip
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apk = Path('/tmp/SDC-v0.3.0.apk')
          source = Path('/tmp/SDC-v0.3.0-source.zip')
          with zipfile.ZipFile(source) as archive:
              assert archive.testzip() is None
              assert 'SDC/project.godot' in archive.namelist()
          assert apk.read_bytes()[:2] == b'PK'
          PY
          sha256sum /tmp/SDC-v0.3.0.apk /tmp/SDC-v0.3.0-source.zip > /tmp/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.3.0 \
            /tmp/SDC-v0.3.0.apk \
            /tmp/SDC-v0.3.0-source.zip \
            previews/interface-demo.mp4 \
            /tmp/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "SDC 0.3.0" \
            --notes "Android 7.0+ ARM64 debug build. Source ZIP contains the complete Godot project."
